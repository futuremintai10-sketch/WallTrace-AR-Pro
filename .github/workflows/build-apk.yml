name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Android lint
        run: |
          gradle --no-daemon lintDebug
          cat app/build/reports/lint-results-debug.txt

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
              print(f"{r.get('name')}: {r.get('tests')} tests, {r.get('failures')} failures")
          print(f"TOTAL: {total} tests, {failures} failures, {errors} errors, {skipped} skipped")
          EOF

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^package:|[sS]dkVersion|targetSdkVersion|uses-permission|uses-feature|application-label:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallTrace-AR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WallTrace-AR.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" WallTrace-AR.apk \
            --target "$GITHUB_SHA" \
            --title "WallTrace AR (build ${{ github.run_number }})" \
            --notes "Debug APK built from $GITHUB_SHA. Install on an ARCore-supported Android 7.0+ phone." \
            --latest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WallTrace-AR-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
